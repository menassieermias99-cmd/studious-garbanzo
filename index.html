<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rec Studio - Browser screen studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="studio-container">
      <!-- SIDEBAR CONTROLS -->
      <aside class="sidebar">
        <div class="brand">
          <span class="rec-dot"></span>
          <h2>Rec Studio</h2>
        </div>

        <div class="control-group">
          <h3>1. Sources</h3>
          <button id="btnScreen" class="btn secondary">🖥️ Share Screen</button>
          <button id="btnWebcam" class="btn secondary">📷 Toggle Webcam</button>
        </div>

        <div class="control-group">
          <h3>2. Customization</h3>
          <label for="watermarkInput">Watermark Text</label>
          <input
            type="text"
            id="watermarkInput"
            placeholder="e.g Cofidential Draft"
            value="RecStudio on Studious-garbanzo"
          />

          <label for="pipPosition">Webcam Position</label>
          <select name="pip-position" id="pipPosition">
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="top-right">Top Right</option>
            <option value="top-left">Top Left</option>
          </select>
        </div>

        <div class="control-group">
          <h3>3. Recording</h3>
          <button id="btnRecord" class="btn primary">🔴 Start Recording</button>
          <button id="btnStop" class="btn primary">⏹️ Stop</button>
          <div class="timer" id="timer">00:00:00</div>
        </div>
      </aside>

      <!-- MAIN WORKSPACE -->
      <main class="workspace">
        <!-- LIVE STUDIO CANVAS REVIEW -->
        <div class="canvas-wrapper">
          <canvas id="studio-canvas" width="1920" height="1080"></canvas>
          <div class="status-badge" id="statusBadge">Ready</div>
        </div>

        <!-- OUTPUT PREVIEW SECTION -->
        <div id="outputSection" class="output-section hidden">
          <h3>Latest Recording</h3>
          <video controls id="previewPlayer"></video>
          <a
            href=""
            id="download-link"
            class="btn success"
            download="studio-recording.webm"
            >💾 Download Webm</a
          >
        </div>
      </main>
    </div>

    <!-- HIDDEN VIDEO ELEMENTS TO BUFFER RAW FEEDS -->

    <video
      src=""
      id="rawScreenVideo"
      autoplay
      playsinline
      style="display: none"
    ></video>
    <video
      src=""
      id="rawWebcamVideo"
      autoplay
      playsinline
      style="display: none"
    ></video>

    <script src="script.js"></script>
  </body>
</html>
