<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rec Studio - Browser Screen Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="studio-container">
      <!-- SIDEBAR CONTROLS -->
      <aside class="sidebar">
        <div class="brand">
          <span class="rec-dot"></span>
          <h2>Studio Rec</h2>
        </div>

        <div class="control-group">
          <h3>1. Sources</h3>
          <button id="btnScreen" class="btn secondary">🖥️ Share Screen</button>
          <button id="btnWebcam" class="btn secondary">📷 Toggle WebCam</button>
        </div>

        <div class="control-group">
          <h3>2. Customization</h3>
          <label for="watermarkInput">Watermark Text</label>
          <input
            type="text"
            id="watermarkInput"
            placeholder="e.g. Confidential Draft"
            value="RecStudio on Studious Garbanzo"
          />

          <label for="pipPosition">Webcam Position</label>
          <select name="pip-position" id="pipPosition">
            <option value="bottom-right">Bottom Right</option>
            <option value="bottom-left">Bottom Left</option>
            <option value="top-right">Top Right</option>
            <option value="top-left">Top Left</option>
          </select>
        </div>

        <div class="control-group">
          <h3>3. Recording</h3>
          <button id="btRecord" class="btn primary" disabled>
            🔴 Start Recording
          </button>
          <button id="btnStop" class="btn danger" disabled>⏹️ Stop</button>
          <div class="timer" id="timer">00:00:00</div>
        </div>
      </aside>

      <!-- MAIN WORKSPACE -->
      <main class="workspace">
        <div class="canvas-wrapper">
          <!-- FIXED ID: studioCanvas -->
          <canvas id="studioCanvas" width="1920" height="1080"></canvas>
          <div class="status-badge" id="statusBadge">Ready</div>
        </div>

        <!-- OUTPUT PREVIEW SECTION -->
        <div id="outputSection" class="output-section hidden">
          <h3>Latest Recording</h3>
          <video controls id="previewPlayer"></video>
          <!-- FIXED ID: downloadLink -->
          <a
            href="#"
            id="downloadLink"
            class="btn success"
            download="studio-recording.webm"
          >
            💾 Download Webm
          </a>
        </div>
      </main>
    </div>

    <!-- HIDDEN BUFFER VIDEOS -->
    <video
      id="rawScreenVideo"
      autoplay
      playsinline
      style="display: none"
    ></video>
    <video
      id="rewWebcamVideo"
      autoplay
      playsinline
      style="display: none"
    ></video>
  </body>

  <script src="script.js"></script>
</html>
